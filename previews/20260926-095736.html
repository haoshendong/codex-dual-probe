<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>皮卡丘开飞机</title>
  <style>
    :root {
      --sky-top: #74d8ff;
      --sky-bottom: #c9f5ff;
      --yellow: #ffd92f;
      --dark: #30251f;
      --red: #e84a43;
      --blue: #3d86d8;
      --cream: #fff3c1;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      overflow: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
        sans-serif;
      background: #9be7ff;
    }

    body {
      display: grid;
      place-items: center;
    }

    .scene {
      position: relative;
      width: min(100vw, 1100px);
      height: min(100vh, 760px);
      min-height: 520px;
      overflow: hidden;
      background:
        linear-gradient(to bottom, var(--sky-top), var(--sky-bottom) 70%, #ffffff);
      isolation: isolate;
    }

    .sun {
      position: absolute;
      top: 7%;
      right: 8%;
      width: 98px;
      aspect-ratio: 1;
      border-radius: 50%;
      background: #fff5a5;
      box-shadow: 0 0 55px 18px rgba(255, 244, 166, 0.55);
      animation: sunPulse 4s ease-in-out infinite;
    }

    .cloud {
      position: absolute;
      width: 170px;
      height: 48px;
      border-radius: 50px;
      background: rgba(255, 255, 255, 0.84);
      filter: blur(0.2px);
      animation: cloudDrift linear infinite;
    }

    .cloud::before,
    .cloud::after {
      content: "";
      position: absolute;
      bottom: 8px;
      border-radius: 50%;
      background: inherit;
    }

    .cloud::before {
      left: 28px;
      width: 72px;
      height: 72px;
    }

    .cloud::after {
      right: 26px;
      width: 58px;
      height: 58px;
    }

    .cloud.one {
      top: 14%;
      left: -190px;
      animation-duration: 26s;
    }

    .cloud.two {
      top: 37%;
      left: -250px;
      transform: scale(0.72);
      animation-duration: 34s;
      animation-delay: -13s;
      opacity: 0.68;
    }

    .cloud.three {
      top: 66%;
      left: -220px;
      transform: scale(0.58);
      animation-duration: 31s;
      animation-delay: -19s;
      opacity: 0.55;
    }

    .speed-line {
      position: absolute;
      width: 120px;
      height: 5px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.78);
      animation: speed linear infinite;
    }

    .speed-line:nth-of-type(1) {
      top: 25%;
      left: 12%;
      animation-duration: 1.8s;
    }

    .speed-line:nth-of-type(2) {
      top: 55%;
      left: 4%;
      width: 82px;
      animation-duration: 1.25s;
      animation-delay: -0.7s;
    }

    .speed-line:nth-of-type(3) {
      top: 78%;
      left: 22%;
      width: 150px;
      animation-duration: 2.2s;
      animation-delay: -1s;
    }

    .title {
      position: absolute;
      z-index: 5;
      top: 30px;
      left: 40px;
      margin: 0;
      color: white;
      text-shadow: 0 3px 0 rgba(37, 124, 169, 0.32);
      letter-spacing: 0.08em;
      font-size: clamp(22px, 3vw, 34px);
      animation: titleFloat 3s ease-in-out infinite;
    }

    .subtitle {
      position: absolute;
      z-index: 5;
      top: 78px;
      left: 43px;
      margin: 0;
      color: rgba(35, 119, 155, 0.72);
      font-size: clamp(12px, 1.5vw, 16px);
    }

    .airplane {
      position: absolute;
      z-index: 4;
      left: 50%;
      top: 48%;
      width: min(78vw, 730px);
      min-width: 500px;
      transform: translate(-50%, -50%);
      animation: planeBob 3.6s ease-in-out infinite;
    }

    .plane-shadow {
      fill: rgba(57, 142, 186, 0.22);
      animation: shadowPulse 3.6s ease-in-out infinite;
      transform-origin: center;
    }

    .propeller {
      transform-box: fill-box;
      transform-origin: center;
      animation: propellerSpin 0.65s linear infinite;
    }

    .wheel {
      animation: wheelBounce 0.8s ease-in-out infinite alternate;
    }

    .pika-body {
      animation: pikaBounce 3.6s ease-in-out infinite;
      transform-origin: center;
    }

    .ear {
      transform-box: fill-box;
      transform-origin: bottom center;
      animation: earWiggle 2.2s ease-in-out infinite;
    }

    .ear.right {
      animation-delay: -0.7s;
    }

    .tail {
      transform-box: fill-box;
      transform-origin: 14% 80%;
      animation: tailSwing 1.8s ease-in-out infinite alternate;
    }

    .cloud-bottom {
      position: absolute;
      z-index: 2;
      left: -5%;
      bottom: -10px;
      width: 110%;
      height: 120px;
      background: #ffffff;
      border-radius: 50% 50% 0 0 / 70% 70% 0 0;
      opacity: 0.84;
    }

    .cloud-bottom::before,
    .cloud-bottom::after {
      content: "";
      position: absolute;
      bottom: 35px;
      width: 210px;
      height: 100px;
      border-radius: 50%;
      background: #ffffff;
    }

    .cloud-bottom::before {
      left: 4%;
    }

    .cloud-bottom::after {
      right: 8%;
      width: 290px;
      height: 125px;
    }

    .caption {
      position: absolute;
      z-index: 6;
      right: 34px;
      bottom: 26px;
      padding: 10px 16px;
      border: 2px solid rgba(255, 255, 255, 0.85);
      border-radius: 999px;
      color: #3177a1;
      background: rgba(255, 255, 255, 0.55);
      backdrop-filter: blur(5px);
      font-size: 14px;
      animation: captionGlow 2.5s ease-in-out infinite;
    }

    @keyframes cloudDrift {
      from {
        margin-left: -180px;
      }
      to {
        margin-left: calc(100vw + 260px);
      }
    }

    @keyframes speed {
      0% {
        transform: translateX(0);
        opacity: 0;
      }
      18% {
        opacity: 1;
      }
      100% {
        transform: translateX(470px);
        opacity: 0;
      }
    }

    @keyframes planeBob {
      0%, 100% {
        transform: translate(-50%, -50%) rotate(-1deg);
      }
      50% {
        transform: translate(-50%, calc(-50% - 15px)) rotate(1.3deg);
      }
    }

    @keyframes pikaBounce {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-5px);
      }
    }

    @keyframes propellerSpin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes wheelBounce {
      from {
        transform: translateY(0);
      }
      to {
        transform: translateY(3px);
      }
    }

    @keyframes earWiggle {
      0%, 75%, 100% {
        transform: rotate(0deg);
      }
      84% {
        transform: rotate(-9deg);
      }
      92% {
        transform: rotate(5deg);
      }
    }

    @keyframes tailSwing {
      from {
        transform: rotate(-3deg);
      }
      to {
        transform: rotate(7deg);
      }
    }

    @keyframes sunPulse {
      0%, 100% {
        transform: scale(1);
      }
      50% {
        transform: scale(1.07);
      }
    }

    @keyframes titleFloat {
      0%, 100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-5px);
      }
    }

    @keyframes shadowPulse {
      0%, 100% {
        opacity: 0.22;
        transform: scaleX(1);
      }
      50% {
        opacity: 0.12;
        transform: scaleX(0.9);
      }
    }

    @keyframes captionGlow {
      0%, 100% {
        box-shadow: 0 0 0 rgba(255, 255, 255, 0);
      }
      50% {
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
      }
    }

    @media (max-width: 650px) {
      .scene {
        min-height: 480px;
      }

      .title {
        top: 22px;
        left: 22px;
      }

      .subtitle {
        top: 62px;
        left: 24px;
      }

      .airplane {
        min-width: 570px;
        left: 52%;
      }

      .caption {
        right: 18px;
        bottom: 18px;
        font-size: 12px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
<body>
  <main class="scene" aria-label="皮卡丘驾驶飞机飞过天空的二维动画">
    <div class="sun"></div>

    <div class="cloud one"></div>
    <div class="cloud two"></div>
    <div class="cloud three"></div>

    <div class="speed-line"></div>
    <div class="speed-line"></div>
    <div class="speed-line"></div>

    <h1 class="title">Pika Air</h1>
    <p class="subtitle">出发！飞向彩虹尽头！</p>

    <svg
      class="airplane"
      viewBox="0 0 800 470"
      role="img"
      aria-label="皮卡丘驾驶黄色小飞机"
    >
      <defs>
        <linearGradient id="planeBody" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff4a8" />
          <stop offset="0.52" stop-color="#ffd83d" />
          <stop offset="1" stop-color="#e8a91e" />
        </linearGradient>

        <linearGradient id="wingBlue" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#74b9ed" />
          <stop offset="1" stop-color="#3672c0" />
        </linearGradient>

        <linearGradient id="glass" x1="0" y1="0" x2="0.9" y2="1">
          <stop offset="0" stop-color="#dffaff" />
          <stop offset="0.5" stop-color="#79caef" />
          <stop offset="1" stop-color="#2e75b8" />
        </linearGradient>

        <filter id="softShadow" x="-30%" y="-30%" width="160%" height="180%">
          <feDropShadow
            dx="0"
            dy="12"
            stdDeviation="10"
            flood-color="#347da0"
            flood-opacity="0.25"
          />
        </filter>
      </defs>

      <ellipse
        class="plane-shadow"
        cx="405"
        cy="408"
        rx="235"
        ry="24"
      />

      <g filter="url(#softShadow)">
        <!-- tail and rear wing -->
        <path
          d="M171 267 L93 212 Q78 202 86 185 L105 145 Q111 133 124 143 L213 211 Z"
          fill="url(#wingBlue)"
          stroke="#275b91"
          stroke-width="7"
          stroke-linejoin="round"
        />
        <path
          d="M175 292 L83 306 Q67 309 69 293 L76 252 Q78 240 92 241 L208 249 Z"
          fill="#4d9bd9"
          stroke="#275b91"
          stroke-width="7"
          stroke-linejoin="round"
        />

        <!-- main aircraft fuselage -->
        <path
          d="M128 239
             Q155 182 238 153
             Q349 115 547 137
             Q638 147 702 205
             Q728 229 707 253
             Q667 298 574 320
             Q397 362 221 319
             Q153 302 128 267
             Q117 253 128 239 Z"
          fill="url(#planeBody)"
          stroke="#a66d17"
          stroke-width="9"
          stroke-linejoin="round"
        />

        <!-- nose stripe -->
        <path
          d="M681 201 Q714 224 707 253 Q681 281 649 294 L627 274 Q653 247 653 215 Z"
          fill="#f17827"
          opacity="0.9"
        />

        <!-- underside -->
        <path
          d="M158 274 Q306 336 528 304 Q617 291 675 260 Q646 302 576 320 Q395 362 221 319 Q173 306 158 274 Z"
          fill="#d99a20"
          opacity="0.58"
        />

        <!-- front wing -->
        <path
          d="M335 276 L289 377 Q284 391 299 395 L379 412 Q392 414 398 401 L429 293 Z"
          fill="url(#wingBlue)"
          stroke="#275b91"
          stroke-width="8"
          stroke-linejoin="round"
        />

        <!-- cockpit -->
        <path
          d="M374 157 Q442 129 518 154 Q553 166 568 206 L567 247 Q503 271 418 250 Q382 239 367 212 Z"
          fill="url(#glass)"
          stroke="#24537e"
          stroke-width="8"
          stroke-linejoin="round"
        />
        <path
          d="M428 151 L420 248"
          fill="none"
          stroke="#d3f8ff"
          stroke-width="7"
          opacity="0.68"
        />
        <path
          d="M390 184 Q430 158 473 163"
          fill="none"
          stroke="white"
          stroke-width="10"
          stroke-linecap="round"
          opacity="0.7"
        />

        <!-- front propeller housing -->
        <ellipse
          cx="701"
          cy="227"
          rx="19"
          ry="34"
          fill="#f4b72d"
          stroke="#a66d17"
          stroke-width="7"
        />

        <!-- propeller -->
        <g class="propeller">
          <path
            d="M702 226 C733 204 759 181 766 190 C773 201 748 226 713 237 Z"
            fill="#f5f9ff"
            stroke="#3578aa"
            stroke-width="6"
          />
          <path
            d="M702 226 C675 250 650 274 642 263 C635 252 657 229 691 217 Z"
            fill="#f5f9ff"
            stroke="#3578aa"
            stroke-width="6"
          />
          <circle
            cx="702"
            cy="226"
            r="13"
            fill="#e8aa24"
            stroke="#945f12"
            stroke-width="5"
          />
        </g>

        <!-- landing gear -->
        <g class="wheel">
          <path
            d="M262 318 L245 363"
            stroke="#6f5127"
            stroke-width="9"
            stroke-linecap="round"
          />
          <circle
            cx="240"
            cy="375"
            r="20"
            fill="#39485c"
            stroke="#202d3e"
            stroke-width="7"
          />
          <circle cx="240" cy="375" r="7" fill="#c6d7df" />
        </g>

        <g class="wheel">
          <path
            d="M535 302 L553 353"
            stroke="#6f5127"
            stroke-width="9"
            stroke-linecap="round"
          />
          <circle
            cx="559"
            cy="366"
            r="20"
            fill="#39485c"
            stroke="#202d3e"
            stroke-width="7"
          />
          <circle cx="559" cy="366" r="7" fill="#c6d7df" />
        </g>

        <!-- Pikachu tail -->
        <g class="tail">
          <path
            d="M226 294 L169 321 L187 345 L132 367 L179 386 L205 352 L246 337 Z"
            fill="#f5c329"
            stroke="#a66d17"
            stroke-width="8"
            stroke-linejoin="round"
          />
        </g>

        <!-- Pikachu body -->
        <g class="pika-body">
          <ellipse
            cx="282"
            cy="239"
            rx="73"
            ry="86"
            fill="#ffd92f"
            stroke="#9b6919"
            stroke-width="8"
          />

          <!-- ears -->
          <g class="ear">
            <path
              d="M235 177 Q206 121 222 83 Q232 59 253 78 Q280 110 272 177 Z"
              fill="#ffd92f"
              stroke="#9b6919"
              stroke-width="8"
            />
            <path
              d="M225 101 Q234 76 249 91 L254 137 Q240 127 225 101 Z"
              fill="#30251f"
            />
          </g>

          <g class="ear right">
            <path
              d="M313 169 Q321 107 353 82 Q373 67 379 92 Q386 139 348 187 Z"
              fill="#ffd92f"
              stroke="#9b6919"
              stroke-width="8"
            />
            <path
              d="M345 102 Q360 83 367 103 Q366 132 346 146 Z"
              fill="#30251f"
            />
          </g>

          <!-- face -->
          <ellipse
            cx="258"
            cy="221"
            rx="8"
            ry="11"
            fill="#30251f"
          />
          <ellipse
            cx="312"
            cy="221"
            rx="8"
            ry="11"
            fill="#30251f"
          />
          <circle cx="255" cy="218" r="3" fill="white" />
          <circle cx="309" cy="218" r="3" fill="white" />

          <circle cx="231" cy="252" r="16" fill="#e84a43" />
          <circle cx="333" cy="252" r="16" fill="#e84a43" />

          <path
            d="M278 231 Q283 237 288 231"
            fill="none"
            stroke="#30251f"
            stroke-width="5"
            stroke-linecap="round"
          />
          <path
            d="M267 245 Q282 258 298 245"
            fill="none"
            stroke="#30251f"
            stroke-width="5"
            stroke-linecap="round"
          />

          <!-- pilot scarf -->
          <path
            d="M220 279 Q282 306 346 278 L339 300 Q279 327 228 300 Z"
            fill="#e84a43"
            stroke="#9e332f"
            stroke-width="6"
          />
          <path
            d="M331 296 L368 322 L339 325 L317 304 Z"
            fill="#e84a43"
            stroke="#9e332f"
            stroke-width="6"
            stroke-linejoin="round"
          />

          <!-- paws on control -->
          <ellipse
            cx="245"
            cy="291"
            rx="19"
            ry="13"
            fill="#f6bd27"
            stroke="#9b6919"
            stroke-width="5"
            transform="rotate(20 245 291)"
          />
          <ellipse
            cx="319"
            cy="291"
            rx="19"
            ry="13"
            fill="#f6bd27"
            stroke="#9b6919"
            stroke-width="5"
            transform="rotate(-20 319 291)"
          />
        </g>

        <!-- dashboard -->
        <path
          d="M393 249 Q464 267 551 245 L553 273 Q466 298 390 276 Z"
          fill="#234d70"
          stroke="#183c5a"
          stroke-width="6"
        />
        <circle cx="433" cy="267" r="8" fill="#ef5c54" />
        <circle cx="463" cy="271" r="8" fill="#5ee09c" />
        <circle cx="493" cy="267" r="8" fill="#ffe56c" />
      </g>
    </svg>

    <div class="cloud-bottom"></div>
    <div class="caption">✦ 今日航线：彩虹云层 ✦</div>
  </main>
</body>
</html>
